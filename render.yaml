# Render Blueprint for the public demo (free web service). The database is a free Neon Postgres (with pgvector):
# paste its connection string as DATABASE_URL when Render asks (postgres:// or postgresql:// both work).
# Step by step: demo/DEPLOY.md.
services:
  - type: web
    name: docs-qa-assistant-demo
    runtime: docker
    plan: free
    region: virginia                      # US East, next to the Neon database (can't be changed later)
    dockerfilePath: ./Dockerfile          # the prod stage: runtime deps only, non-root, embedding model baked in
    dockerCommand: sh docker/demo-start.sh  # migrations + document index, then uvicorn on $PORT
    healthCheckPath: /health
    autoDeploy: true                      # every push to main redeploys
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false                       # asked for at setup: the Neon connection string (database rag_demo)
      - key: GEMINI_API_KEY
        sync: false                       # asked for at setup: the demos' free-tier key, billing OFF
      - key: DEMO_RESET_TOKEN
        generateValue: true               # random; copy it into the GitHub secret DEMO_RESET_TOKEN
