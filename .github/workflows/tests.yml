# Runs everything exactly as it runs locally: inside the dev container, against Postgres +
# pgvector from docker-compose. Tests never call Gemini, so no secrets are needed.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib-only: the frozen corpus and the labeled questions still agree.
      - name: Verify corpus snapshot and question labels
        run: |
          python -m scripts.snapshot_corpus --verify
          python -m scripts.check_questions

      - name: Build dev image
        run: docker compose build api

      - name: Start Postgres
        run: docker compose up -d --wait db

      - name: Run tests
        run: docker compose run --rm -T api uv run --frozen pytest -q

      - name: Migrations apply and match the models
        run: |
          docker compose run --rm -T api uv run --frozen alembic upgrade head
          docker compose run --rm -T api uv run --frozen alembic check

      - name: Build production image
        run: docker build -t docs-qa-api .

      # What Render runs (render.yaml): the start script on a brand-new database, a postgres:// URL as Neon gives
      # it, then every recorded scenario must end where the eval scored it, and the guards must hold.
      - name: Demo boots on a fresh database and replays every scenario
        run: |
          docker compose exec -T db psql -U rag -d rag -c "create database rag_demo"
          NET=$(docker inspect "$(docker compose ps -q db)" -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          docker run -d --name demo --network "$NET" -p 8001:10000 -e PORT=10000 -e DEMO_MODE=true \
            -e DATABASE_URL=postgres://rag:rag@db:5432/rag_demo docs-qa-api sh docker/demo-start.sh
          for i in $(seq 1 120); do curl -sf localhost:8001/health && break; sleep 1; done
          python -m demo.check_replays http://localhost:8001

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs db
          docker logs demo || true
